;
; Asterisk extensions configuration for Kisan Mitra SIP bridge
;
; This file defines how calls are routed through the SIP bridge.
; Calls from the backend are routed to the configured Linphone SIP account.
;

[general]
static=yes
writeprotect=no
clearglobalvars=no

;
; Weather Alert Call Context
; Routes weather alert calls from Kisan Mitra backend to Linphone
;
[weather_alert]
exten => s,1,NoOp(Weather Alert Call from Kisan Mitra)
exten => s,2,Dial(SIP/linphone_account)
exten => s,3,Hangup()

;
; Local context for testing
;
[local]
exten => 100,1,NoOp(Local extension 100)
exten => 100,2,VoiceMail(100@default)
exten => 100,3,Hangup()

;
; Default context
;
[default]
exten => _.,1,NoOp(Call to \${EXTEN})
exten => _.,2,Dial(SIP/\${EXTEN})
exten => _.,3,Hangup()
