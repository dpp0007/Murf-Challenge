;
; SIP configuration for Kisan Mitra
; Defines SIP peers and trunks for Linphone connectivity
;

[general]
context=default
bindport=5060
bindaddr=0.0.0.0
srvlookup=yes
disallow=all
allow=ulaw
allow=alaw
allow=gsm
allow=g726
allow=adpcm
language=en
dtmfmode=rfc2833
nat=force_rport,comedia
sessiontimeout=1800
minexpiry=60
maxexpiry=3600
defaultexpiry=120
;
; Disable HISTORY_FULL_REPORT to reduce logging verbosity
;
verbose_sip_events=no
sipdebug=no

;
; Linphone SIP Trunk Configuration
; This is where Kisan Mitra backend routes weather alert calls
;
[linphone_account](!)
type=peer
insecure=invite,port
nat=force_rport,comedia
dtmfmode=rfc2833
canreinvite=no
videosupport=no
;
; Note: Credentials will be loaded from Linphone registered account
; The Linphone client registers with sip.linphone.org
; This peer definition allows outbound calls
;
host=sip.linphone.org
port=5060
context=weather_alert
allow=ulaw,alaw
disallow=all

;
; SIP Trunk registration (if needed)
; Uncomment and configure for direct registration
;
; register => username:password@sip.linphone.org

;
; Local extension for testing
;
[test_extension](!)
type=peer
host=dynamic
context=local
dtmfmode=rfc2833
disallow=all
allow=ulaw
allow=alaw
canreinvite=no

[100](test_extension)

;
; RTP Configuration
;
rtpstart=10000
rtpend=10200
